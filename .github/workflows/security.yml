name: Public SDK security checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sdk-security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.0'
          cache: false
      - name: Check source boundary and publication guards
        run: |
          python3 scripts/check_layout.py
          python3 -m unittest discover -s scripts/tests -v
          bash -n scripts/build-sdk.sh scripts/publish-maven.sh
          git diff --check
      - name: Scan public source without exposing matched secrets
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.24.3
          gitleaks dir . --redact --no-banner
      - name: Validate immutable-pinned publishing workflows
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          actionlint -shellcheck=
